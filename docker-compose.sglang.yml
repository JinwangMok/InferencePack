version: "3.8"

services:
  sglang:
    image: lmsysorg/sglang:latest-runtime
    container_name: inferencepack-sglang
    restart: unless-stopped
    gpus: all
    shm_size: 32gb
    ipc: host
    ports:
      - "8002:30000"
    volumes:
      - /models:/models
    environment:
      - HF_HOME=/models/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      python3 -m sglang.launch_server
      --model-path /models/EXAONE-3.5-32B-Instruct
      --host 0.0.0.0
      --port 30000
      --tp 8
      --dp 1
      --mem-fraction-static 0.80
      --chunked-prefill-size 4096
      --trust-remote-code
    networks:
      - inferencepack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  inferencepack:
    external: true
    name: inferencepack
