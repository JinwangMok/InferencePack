services:
  sglang:
    image: lmsysorg/sglang:latest-runtime
    container_name: inferencepack-sglang
    restart: unless-stopped
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ports:
      - "8000:30000"
    environment:
      - HF_HOME=/models/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - OTEL_SERVICE_NAME=sglang-server
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
    volumes:
      - /models:/models
    command: >
      python3 -m sglang.launch_server
      --model-path /models/EXAONE-3.5-32B-Instruct
      --host 0.0.0.0
      --port 30000
      --tp 8
      --dp 1
      --mem-fraction-static 0.80
      --chunked-prefill-size 4096
      --trust-remote-code
      --enable-trace
      --otlp-traces-endpoint ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
    networks:
      - inferencepack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  inferencepack:
    external: true
    name: inferencepack
