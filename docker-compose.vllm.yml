services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: inferencepack-vllm
    restart: unless-stopped
    shm_size: 16gb
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/models/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - OTEL_SERVICE_NAME=vllm-server
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
      - OTEL_EXPORTER_OTLP_TRACES_INSECURE=true
    volumes:
      - /models:/models
    command:
      - --model
      - /models/EXAONE-3.5-32B-Instruct
      - --trust-remote-code
      - --tensor-parallel-size
      - "7"
      - --gpu-memory-utilization
      - "0.92"
      - --max-model-len
      - "32768"
      - --dtype
      - bfloat16
      - --port
      - "8000"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --otlp-traces-endpoint
      - "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}"
    networks:
      - inferencepack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: inferencepack-openwebui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=${VLLM_API_KEY:-}
      - DEFAULT_MODELS=EXAONE-3.5-32B-Instruct
      - ENABLE_SIGNUP=true
      - WEBUI_AUTH=false
      - HF_HOME=/models/.cache/huggingface
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - inferencepack
    depends_on:
      vllm:
        condition: service_started

volumes:
  openwebui_data:

networks:
  inferencepack:
    external: true
    name: inferencepack
