services:
  tensorrtllm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: inferencepack-tensorrtllm
    restart: unless-stopped
    shm_size: 16gb
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      - HF_HOME=/models/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - OTEL_SERVICE_NAME=tensorrtllm-server
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
    volumes:
      - /models:/models
      - /models/.cache/tensorrtllm:/root/.cache/tensorrtllm
    command: >
      trtllm-serve
      /models/EXAONE-3.5-32B-Instruct
      --tp_size 4
      --pp_size 1
      --host 0.0.0.0
      --port 8000
      --otlp_traces_endpoint ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
    networks:
      - inferencepack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: inferencepack-openwebui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://tensorrtllm:8000/v1
      - OPENAI_API_KEY=${VLLM_API_KEY:-}
      - DEFAULT_MODELS=/models/EXAONE-3.5-32B-Instruct
      - ENABLE_SIGNUP=true
      - WEBUI_AUTH=false
      - HF_HOME=/models/.cache/huggingface
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - inferencepack
    depends_on:
      tensorrtllm:
        condition: service_started

volumes:
  openwebui_data:

networks:
  inferencepack:
    external: true
    name: inferencepack
